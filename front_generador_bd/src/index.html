<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Lienzo Colaborativo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

  <script>
    // Aplica el tema guardado antes del primer pintado.
    // Sin esto, el usuario ve un destello del tema equivocado
    // entre que carga el HTML y arranca Angular.
    (function () {
      try {
        var t = localStorage.getItem('uml-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* modo privado: queda el tema por defecto */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
