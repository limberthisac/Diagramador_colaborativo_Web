<header class="topbar">

  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
      stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z" fill="currentColor" fill-opacity=".18" />
      <path d="m3 12 9 4.5 9-4.5" />
      <path d="m3 16.5 9 4.5 9-4.5" />
    </svg>
    <span class="brand-name">Diagramador UML Colaborativo</span>
  </div>

  <div class="spacer"></div>

  <div class="peers">
    @for (p of presence.peers(); track p.id) {
      <span class="peer" [style.background]="p.color" [title]="p.isSelf ? p.name + ' (tú)' : p.name">
        {{ p.initials }}
      </span>
    }
    <span class="peer-count">{{ presence.count() }} {{ presence.count() === 1 ? 'activo' : 'activos' }}</span>
  </div>

  <button type="button" class="theme-toggle" (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    [title]="theme.isDark() ? 'Modo claro' : 'Modo oscuro'">
    @if (theme.isDark()) {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" />
      </svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
      </svg>
    }
  </button>

</header>
