<div class="app-shell">

  @if (needsName()) {
    <app-join-name (confirmed)="onNameConfirmed()" />
  }

  <app-top-bar />

  <div class="app-layout">
    <app-side-panel #sidePanel></app-side-panel>

    <div class="canvas-wrapper" cdkDropListGroup>
      <div #paperContainer class="diagram-container" cdkDropList>
        <!-- Aquí se renderiza el canvas de JointJS -->
      </div>

      <div class="zoom-control">
        <button type="button" (click)="zoomIn()" aria-label="Acercar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button type="button" (click)="zoomOut()" aria-label="Alejar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M5 12h14" />
          </svg>
        </button>
        <span class="sep"></span>
        <button type="button" (click)="resetZoom()" aria-label="Restablecer zoom">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8 8 0 1 0-2.3 6.3" />
            <path d="M20 5v6h-6" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
